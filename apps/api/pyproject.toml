[project]
name = "vulnflow-api"
version = "0.1.0"
description = "VulnFlow AI SaaS Backend Core API (FastAPI) — SDD §2.2.2 Container"
requires-python = ">=3.12"
dependencies = [
    "vulnflow-contracts",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "celery>=5.4.0",
    "redis>=5.1.1",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.3",
    "weasyprint>=62.3",
    "boto3>=1.35.0",
    "httpx>=0.27.2",
]

[tool.uv.sources]
vulnflow-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
