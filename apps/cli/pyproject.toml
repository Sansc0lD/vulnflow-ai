[project]
name = "vulnflow-cli"
version = "0.1.0"
description = "VulnFlow AI Local CLI Agent (Typer + Rich) — SDD §2.2.2 Container"
requires-python = ">=3.12"
dependencies = [
    "vulnflow-contracts",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "httpx>=0.27.2",
    "defusedxml>=0.7.1",
]

[project.scripts]
vulnflow = "vulnflow.main:app"

[tool.uv.sources]
vulnflow-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vulnflow"]
