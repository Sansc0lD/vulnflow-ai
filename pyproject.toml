[project]
name = "vulnflow-ai"
version = "0.1.0"
description = "VulnFlow AI - SaaS Vulnerability Management & Reporting Assistant (IPPL)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/cli", "packages/contracts"]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit[toml]>=1.7.10",
    "pip-audit>=2.7.3",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "types-defusedxml>=0.7.0",
]

# ---------------------------------------------------------------------------
# 2.1 Tooling Mutu Backend & CLI (PLAN.md §2.1) — Python 3.12+, zero-tolerance
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/app", "apps/cli/vulnflow", "packages/contracts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort (import sorting)
    "UP",            # pyupgrade
    "B",             # bugbear (common anti-patterns)
    "C4",            # comprehensions
    "SIM",           # simplify
]
# Deliberately NOT enabling "D" (pydocstyle): this project follows a
# comments-only-when-non-obvious style, not mandatory docstrings on every
# function — forcing D here would make ruff fight that convention.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "migrations/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Pustaka pihak ketiga tanpa py.typed/stubs resmi (FASE 2-5: SQLAlchemy driver,
# Celery worker, PDF render, S3 client) — tanpa override ini, mypy --strict
# gagal murni karena ketiadaan stub, bukan karena bug di kode kita.
module = ["boto3.*", "botocore.*", "celery.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "resilience: EC-01..EC-18 resilience/edge-case tests (FASE 7.2)",
]

[tool.coverage.run]
branch = true
source = ["apps/api/app", "apps/cli/vulnflow", "packages/contracts"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 0  # Ambang 85% baru ditegakkan hard-fail di FASE 7 (lihat PLAN.md §4.1) — scripts/check_quality.py yang menegakkan ambangnya secara bertahap, bukan konfigurasi statis ini.
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = []
