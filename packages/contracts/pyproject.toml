[project]
name = "vulnflow-contracts"
version = "0.1.0"
description = "Shared Pydantic V2 data contracts for VulnFlow AI (apps/api + apps/cli) — SDD Bab 2.6.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "email-validator>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vulnflow_contracts"]
