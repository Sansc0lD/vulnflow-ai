name: vulnflow-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: vulnflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vulnflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vulnflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnflow} -d ${POSTGRES_DB:-vulnflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnflow_net

  redis:
    image: redis:7.2-alpine
    container_name: vulnflow-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - vulnflow_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnflow_net

  minio:
    # minio/minio (Docker Hub) and quay.io/minio/minio were both pulled from
    # public access in Sept 2026 as part of MinIO's licensing changes (every
    # tag now 401s/pull-denied, confirmed directly against both registries).
    # cgr.dev/chainguard/minio is the maintained still-public replacement.
    # Chainguard only publishes a rolling `latest` (no long-lived pinned
    # historical release tags like MinIO's old scheme), so this is a floating
    # tag by necessity, not by choice (see LOW-02 in AUDIT_FINDINGS.md).
    image: cgr.dev/chainguard/minio:latest
    container_name: vulnflow-minio
    restart: unless-stopped
    # Chainguard's image runs as a non-root user by default, which can't
    # write to the mounted /data volume; root is required for the server to
    # format/use its own data directory. Confirmed by actually running the
    # image both ways — non-root fails with "Unable to initialize backend:
    # file access denied", root boots cleanly and passes its own healthcheck.
    user: root
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - vulnflow_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnflow_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vulnflow-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-vulnflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vulnflow}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulnflow_net

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vulnflow-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-vulnflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vulnflow}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vulnflow_net

networks:
  vulnflow_net:
    driver: bridge

volumes:
  vulnflow_postgres_data:
  vulnflow_redis_data:
  vulnflow_minio_data:
